name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal, release)
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Unit tests
        run: swift test
